name: Reusable Deploy
on:
  workflow_call:
    inputs:
        artifact-name:
            description: The name of deployable artifact
            required: true
            type: string
            default: dist
    outputs:
        result:
            description: Result of the deployment
            value: ${{ jobs.deploy.outputs.outcome }}
    #secrets:
    #    some-secret:
    #        required: true
jobs:
    deploy:
        outputs:
          outcome: ${{steps.set-result.outputs.step-result}}
        runs-on: ubuntu-latest
        steps:
            - name: Get code
              uses: actions/download-artifact@v8
              with:
                name: ${{ inputs.artifact-name }}
            - name: List files
              run: ls
            - name: Output Info
              run: echo "Deploying & uploading"
            - name: Set result output
              id: set-result
              run: echo "step-result=sucess" >> $GITHUB_OUTPUT