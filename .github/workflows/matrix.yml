name: Matrix demo
on: push

jobs:
    build:
        strategy:
            matrix:
                node-version: [14,16,18]
                operating-system: [ubuntu-latest]
        runs-on: ${{matrix.operating-system}}
        steps:
            - name: Get code
              uses: actions/checkout@v7
            - name: Install NodeJS
              uses: actions/setup-node@v7
              with:
                node-version: ${{matrix.node-version}}
            - name: Install dependencies
              run: npm ci
            - name: Build project
              run: npm run build
